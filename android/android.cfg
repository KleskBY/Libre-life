// Phone defaults, executed after default.cfg/autoexec.cfg via +exec on the command line.
r_shadow_realtime_world 0
r_shadow_realtime_world_shadows 0
r_shadow_realtime_dlight 1 // flashlight is a dynamic light; without this it lights nothing
r_shadow_realtime_dlight_shadows 0
vid_samples 0
r_fxaa 0

// every one of these renders the scene or the screen an extra time
r_water 0
r_glsl_postprocess 0
r_bloom 0
r_hdr 0
r_motionblur 0
r_damageblur 0
r_coronas 0

// 3D view renders to an 8-bit framebuffer below screen resolution; HUD and menus stay native.
// fpsscaling trims the scale further when the frame rate drops below the target.
r_viewfbo 1
r_viewscale_fpsscaling 1 // base scale is the engine cvar mobile_viewscale, CSQC overwrites r_viewscale
r_viewscale_fpsscaling_target 60
r_viewscale_fpsscaling_min 0.5

// frame pacing: the swap blocks on vsync, which also keeps MediaTek GPU frequency scaling from
// clocking down; with vsync 0 every sixth swap stalled 35 ms waiting on the GPU
cl_maxfps 0
vid_vsync 1

cl_particles_quality 0.5
cl_decals_models 0
r_lerpmodels 1 // required: thinned models blend between stored poses

touch_look_sensitivity 0.3
