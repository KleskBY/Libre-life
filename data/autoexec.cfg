sv_cheats 1
bind TILDE "toggleconsole"
bind BACKQUOTE "toggleconsole"
sv_sound_land player/pl_jumpland2.wav
mod_obj_orientation 0 //OBJ map
sv_protocolname DP7

exec alias.cfg
exec debug.cfg
exec skill.cfg

scr_levelshot_auto 0
scr_loadingscreen_background 1
scr_loadingscreen_scale_limit 0
scr_centertime 3

sv_gameplayfix_swiminbmodels 1
sv_save_screenshots 0
sv_precache_suppress_warning 1


//Reset state
fov 80
cl_beams_quakepositionhack 0
cl_particles_explosions_shell 1
cl_deathfade 0.5
cl_hud 1
crosshair 1
viewsize 100
//We need this so player wont fall through the rotary geometry and better Q1 support
//But it ignore collisions with transaprent textures, need custom shader...
//mod_q1bsp_polygoncollisions 1 

//FTE
sv_nqplayerphysics 0 //FTE prediction breaks teleport and standing on crates
r_particledesc "spikeset effectinfo"
r_part_sparks_textured "1"
r_part_sparks_trifan "1"
r_part_maxparticles "16384"
r_part_maxdecals "1024"

stuffcmds //Final, execute startup parms