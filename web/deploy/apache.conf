
<Directory /var/www/html/libre-life/webport>
    Require all granted
    AllowOverride None
    Options -Indexes -MultiViews +FollowSymLinks
    DirectoryIndex index.html
    FallbackResource disabled
    ErrorDocument 404 default

    AddType application/wasm .wasm
    AddType application/octet-stream .pk3 .fmf
    AddType application/json .json
    AddType text/javascript .js
    AddType text/css .css
    AddType text/html .html
    RemoveType .gz
    AddEncoding gzip .gz

    RewriteEngine On

    RewriteCond %{HTTP_HOST} ^(www\.)?quake\.by\.?$ [NC]
    RewriteRule ^ https://quake.zone%{REQUEST_URI} [R=301,L]

    RewriteCond %{HTTP:Accept-Encoding} gzip [NC]
    RewriteCond %{HTTP:Accept-Encoding} "!gzip\s*;\s*q=0(?:\.0*)?\s*(?:,|$)" [NC]
    RewriteCond %{REQUEST_FILENAME}.gz -f
    RewriteRule ^(.+\.(?:html|css|js|json|wasm|pk3|fmf))$ $1.gz [L]

    <FilesMatch "\.gz$">
        SetEnv no-gzip 1
        SetEnv no-brotli 1
    </FilesMatch>
    Header merge Vary Accept-Encoding
    Header always set Cache-Control "no-cache"
</Directory>
