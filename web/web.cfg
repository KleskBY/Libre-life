// Browser defaults; applied after desktop default.cfg.
pr_ssqc_memsize 67108864
pr_csqc_memsize 33554432
sv_public 0
maxplayers 1
coop 0
deathmatch 0
sv_nqplayerphysics 0
set sv_hitmodel 0
vid_fullscreen 0
vid_conautoscale 0
vid_conwidth 960
vid_conheight 540
r_font_linear 1
// 0 = render every display frame (vsync); a fixed cap judders on 90/120 Hz phones.
cl_maxfps 0
fov 80
crosshair 1
set cl_hud 1
viewsize 100
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
r_shadow_realtime_dlight_shadows 0
r_bloom 0
r_particledesc "spikeset effectinfo"
r_part_maxparticles 4096
r_part_maxdecals 256
cfg_save_auto 0
bind F5 ""
bind F9 ""
bind F11 ""
bind F12 ""
bind F6 "quicksave"
bind F8 "load quick"
bind e "+use"
bind f "cmd flashlight"
bind CTRL ""
bind LCTRL ""
bind RCTRL ""
bind c "+button3"
bind p "togglemenu"
bind MOUSE2 "+button6"
